<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · BROKEN Movies</title>
<style>
:root{--bg:#0f0f14;--bg2:#17171f;--card:#1c1c26;--border:#282833;--red:#e50914;--text:#fff;--muted:#8a8a9a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-wrap{width:100%;max-width:400px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:30px}
.logo{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--red),#ff4d4d);display:flex;align-items:center;justify-content:center;font-size:26px}
.brand b{font-size:24px;letter-spacing:.5px}
.brand b span{color:var(--red)}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:30px}
.box h1{font-size:22px;margin-bottom:6px}
.box .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.field input:focus{border-color:var(--red)}
.btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--red);color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-top:6px}
.btn.ghost{background:transparent;border:1px solid var(--border);margin-top:10px;color:var(--text)}
.row{display:flex;justify-content:space-between;align-items:center;margin:12px 0;font-size:13px;color:var(--muted)}
.row a{color:var(--red);text-decoration:none}
.alt{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
.alt a{color:var(--red);text-decoration:none;font-weight:600}
.demo{margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:12px;color:var(--muted);text-align:center}
.demo b{color:var(--text)}
.err{color:var(--red);font-size:12px;margin-top:8px;display:none;text-align:center}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="brand">
    <div class="logo">▶</div>
    <b>BROKEN <span>Movies</span></b>
  </div>
  <div class="box" id="loginBox">
    <h1>Welcome back</h1>
    <div class="sub">Sign in to keep watching your favorites</div>
    <div class="field"><label>Email</label><input id="email" type="email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input id="pass" type="password" placeholder="••••••••"></div>
    <div class="err" id="err">Invalid email or password.</div>
    <button class="btn" onclick="login()">Sign In</button>
    <div class="row"><label style="display:flex;gap:6px;align-items:center;color:var(--muted)"><input type="checkbox"> Remember me</label><a href="#">Forgot?</a></div>
    <div class="alt">New here? <a href="#" onclick="showSignup()">Create account</a></div>
  </div>
  <div class="box" id="signupBox" style="display:none">
    <h1>Create account</h1>
    <div class="sub">Start streaming unlimited movies & series</div>
    <div class="field"><label>Name</label><input id="sname" placeholder="Your name"></div>
    <div class="field"><label>Email</label><input id="semail" type="email" placeholder="you@email.com"></div>
    <div class="field"><label>Password</label><input id="spass" type="password" placeholder="Min 6 characters"></div>
    <button class="btn" onclick="signup()">Create Account</button>
    <div class="alt">Already have an account? <a href="#" onclick="showLogin()">Sign in</a></div>
  </div>
</div>
<script>
function setErr(m){ const e=document.getElementById('err'); e.style.display='block'; e.textContent=m; }
function login(){
  const em=document.getElementById('email').value.trim().toLowerCase();
  const p=document.getElementById('pass').value;
  if(em==='demo@broken.com'&&p==='broken123'){
    localStorage.setItem('bm_user','demo'); window.location.href='index.html';
  } else setErr('Invalid email or password.');
}
function signup(){
  const n=document.getElementById('sname').value.trim();
  const em=document.getElementById('semail').value.trim();
  const p=document.getElementById('spass').value;
  if(!n||!em||p.length<6) return setErr('Fill all fields (password 6+ chars).');
  localStorage.setItem('bm_user',n); localStorage.setItem('bm_email',em);
  window.location.href='index.html';
}
function showSignup(){document.getElementById('loginBox').style.display='none';document.getElementById('signupBox').style.display='block';document.getElementById('err').style.display='none';}
function showLogin(){document.getElementById('signupBox').style.display='none';document.getElementById('loginBox').style.display='block';document.getElementById('err').style.display='none';}
</script>
</body>
</html>
