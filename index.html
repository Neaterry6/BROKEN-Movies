<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BROKEN Movies — Movies, Series, Anime</title>
<meta name="description" content="BROKEN Movies · Movies · Series · Anime · Nollywood · K-Drama — stream it all in one place.">
<style>
  :root{
    --ink:#07070a;
    --ink-2:#141417;
    --accent:#ff3b5c;
    --accent-dim:#ff3b5c66;
    --text:#f4f2ee;
    --text-dim:#f4f2eeaa;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.1);
    --glass-border:rgba(255,255,255,0.22);
    --glass-blur:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--ink);color:var(--text);
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body{overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;}

  #app{
    position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,59,92,0.16), transparent 45%),
      radial-gradient(circle at 85% 18%, rgba(80,120,255,0.12), transparent 42%),
      radial-gradient(circle at 30% 90%, rgba(255,150,40,0.1), transparent 40%),
      var(--ink);
    padding-bottom:110px;
  }
  #app::-webkit-scrollbar{display:none;}

  .glass{
    background:rgba(28,28,32,0.55);
    border:1px solid var(--glass-border);
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4),0 2px 8px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.25),inset 0 -8px 16px rgba(0,0,0,0.2);
    transform:translateZ(0);
  }
  @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
    .glass{background:var(--glass);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(180%);backdrop-filter:blur(var(--glass-blur)) saturate(180%);}
  }

  /* ===== App bar ===== */
  #appbar{
    position:sticky;top:0;z-index:9;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px 10px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:.3px;}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#ff7a5c);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 12px rgba(255,59,92,0.4);}
  .brand span{color:var(--accent);}
  .appbar-actions{display:flex;gap:8px;}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;
    border:1px solid var(--glass-border);
  }
  .icon-btn:active{transform:scale(0.9);}

  /* ===== Search ===== */
  #searchWrap{display:none;padding:0 16px 10px;}
  #searchWrap.open{display:block;}
  #searchBox{
    width:100%;padding:13px 15px;border-radius:16px;outline:none;
    background:var(--glass-strong);border:1px solid var(--glass-border);color:var(--text);font-size:14px;
  }
  #searchBox:focus{border-color:var(--accent);}

  /* ===== Category pills ===== */
  .cat-scroll{
    display:flex;gap:8px;overflow-x:auto;padding:6px 16px 12px;
    scrollbar-width:none;
  }
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;padding:8px 15px;border-radius:20px;cursor:pointer;
    font-size:12.5px;font-weight:700;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-border);
    transition:transform .15s ease;
  }
  .cat-pill:active{transform:scale(0.94);}
  .cat-pill.active{color:var(--text);background:rgba(255,59,92,0.16);border-color:rgba(255,59,92,0.4);}

  /* ===== Featured hero ===== */
  .featured{
    position:relative;margin:4px 16px 8px;height:230px;border-radius:22px;
    overflow:hidden;cursor:pointer;
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 14px 32px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.14);
    transition:opacity .4s ease;
  }
  .featured.fading{opacity:0;}
  .featured img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .featured .scrim{position:absolute;inset:0;background:linear-gradient(to top, rgba(7,7,10,0.95) 0%, rgba(7,7,10,0.35) 50%, rgba(7,7,10,0.1) 100%);}
  .featured .fbody{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;}
  .featured .ftag{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
  .featured .fname{font-size:20px;font-weight:800;line-height:1.2;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .featured .fgenre{font-size:12px;color:var(--text-dim);margin-top:4px;}
  .featured .fplay{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:9px 16px;border-radius:22px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700;border:none;cursor:pointer;box-shadow:0 6px 16px rgba(255,59,92,0.4);}
  .hero-dots{position:absolute;right:16px;bottom:16px;z-index:3;display:flex;gap:5px;}
  .hero-dots .dot{width:6px;height:6px;border-radius:6px;background:rgba(255,255,255,0.35);transition:all .3s ease;cursor:pointer;}
  .hero-dots .dot.active{background:var(--text);width:16px;}

  /* ===== Section rows ===== */
  .section-label-row{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px;}
  .section-label{font-size:16px;font-weight:800;letter-spacing:.2px;}
  .section-label small{color:var(--text-dim);font-size:11px;font-weight:600;margin-left:8px;}
  .see-all{font-size:12px;font-weight:700;color:var(--text-dim);cursor:pointer;flex-shrink:0;padding:4px 8px;}
  .see-all:active{color:var(--accent);}

  .row{
    display:flex;gap:10px;overflow-x:auto;padding:2px 16px 10px;
    scrollbar-width:none;
  }
  .row::-webkit-scrollbar{display:none;}

  /* ===== Cards ===== */
  .card{
    flex:0 0 auto;width:112px;cursor:pointer;position:relative;
    transition:transform .15s ease;
  }
  .card:active{transform:scale(0.96);}
  .card .poster{
    width:112px;height:150px;border-radius:14px;overflow:hidden;position:relative;
    background:var(--glass-strong);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:0 8px 18px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.14);
  }
  .card .poster img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .poster .noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:30px;background:linear-gradient(160deg,#232330,#17171f);}
  .card .name{font-size:11.5px;font-weight:600;margin-top:6px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text);}
  .card .genre{font-size:10px;color:var(--text-dim);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .card .badge{position:absolute;top:6px;left:6px;z-index:1;padding:3px 7px;border-radius:8px;font-size:8.5px;font-weight:800;letter-spacing:.4px;color:#fff;text-transform:uppercase;background:linear-gradient(180deg,rgba(255,90,120,0.95),rgba(140,30,60,0.95));box-shadow:0 3px 8px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.25);}
  .card .badge.movie{background:linear-gradient(180deg,rgba(80,150,255,0.95),rgba(40,80,180,0.95));}
  .card .fav{
    position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;
    background:rgba(0,0,0,0.5);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
    backdrop-filter:blur(6px);font-size:13px;
  }
  .card .fav.on{color:var(--accent);}
  .card .progress{position:absolute;left:6px;right:6px;bottom:6px;height:4px;border-radius:4px;background:rgba(255,255,255,0.25);overflow:hidden;z-index:1;}
  .card .progress>div{height:100%;background:var(--accent);border-radius:4px;}
  .card .playov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.25);}

  /* ===== Grid (lists / search results) ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:14px 10px;padding:6px 16px 20px;}
  .grid .card{width:auto;}
  .grid .card .poster{width:100%;height:auto;aspect-ratio:2/3;}

  .page-title{font-size:20px;font-weight:800;padding:16px 16px 4px;}
  .page-sub{font-size:12px;color:var(--text-dim);padding:0 16px 12px;}

  /* ===== Loading / empty ===== */
  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--text-dim);font-size:13px;gap:14px;}
  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,0.15);border-top-color:var(--accent);animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .empty{text-align:center;color:var(--text-dim);font-size:13px;padding:70px 20px;line-height:1.6;}

  /* ===== Detail ===== */
  #detail{position:fixed;inset:0;z-index:12;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;display:none;}
  #detail::-webkit-scrollbar{display:none;}
  .dhero{position:relative;height:52vh;min-height:300px;}
  .dhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .dhero .scrim{position:absolute;inset:0;background:linear-gradient(to top,var(--ink) 5%,rgba(7,7,10,0.4) 60%,rgba(7,7,10,0.2) 100%);}
  .dback{position:absolute;top:14px;left:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,0.5);border:none;color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(6px);}
  .dinfo{padding:4px 18px 30px;position:relative;margin-top:-30px;z-index:2;}
  .dtag{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--accent);text-transform:uppercase;}
  .dtitle{font-size:26px;font-weight:800;line-height:1.15;margin:6px 0 8px;}
  .dmeta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .dmeta .rating{color:#ffd24a;}
  .dsynopsis{font-size:13.5px;color:var(--text-dim);line-height:1.6;margin-bottom:18px;}
  .dbtns{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .btn{border:none;border-radius:14px;padding:13px 20px;font-size:13.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .btn-play{background:var(--accent);color:#fff;flex:1;justify-content:center;box-shadow:0 8px 20px rgba(255,59,92,0.35);}
  .btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--glass-border);}
  .btn-dl{background:var(--glass-strong);color:var(--text);border:1px solid var(--glass-border);}
  .btn.on{color:var(--accent);}
  .dsec-label{font-size:14px;font-weight:800;margin:4px 0 10px;}
  .quality-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;}
  .quality-row::-webkit-scrollbar{display:none;}
  .q-btn{flex:0 0 auto;padding:8px 14px;border-radius:12px;font-size:12px;font-weight:700;cursor:pointer;background:var(--glass);color:var(--text-dim);border:1px solid var(--glass-border);}
  .q-btn.active{background:rgba(255,59,92,0.18);color:var(--text);border-color:rgba(255,59,92,0.4);}

  /* ===== Movie Player ===== */
  #playerWrap{display:none;}
  #moviePlayer{
    position:fixed;top:0;left:0;right:0;z-index:20;
    background:var(--ink);
    display:flex;flex-direction:column;
  }
  #moviePlayer.open{display:flex;}
  #playerTop{display:flex;align-items:center;gap:10px;padding:10px 14px;}
  #playerTop .p-back{background:none;border:none;color:var(--text);font-size:18px;cursor:pointer;padding:4px;}
  #playerTop .p-title{font-size:13px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #playerTop .p-btn{background:var(--glass);border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;}
  #videoWrap{width:100%;aspect-ratio:16/9;background:#000;position:relative;}
  #videoWrap video{width:100%;height:100%;object-fit:contain;display:block;}
  #playerInfo{display:block;padding:16px 16px 30px;overflow-y:auto;}
  #playerInfo.hidden{display:none;}
  #moviePlayer.cinema #videoWrap{position:fixed;top:50%;left:50%;width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center;background:#000;}
  #moviePlayer.cinema #playerTop,#moviePlayer.cinema #playerInfo{display:none;}
  #moviePlayer.cinema .cinema-bar{position:fixed;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:3;}
  #moviePlayer.cinema .c-btn{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .cinema-bar{display:none;}
  #moviePlayer.minimized,#moviePlayer.minimized-large{inset:auto;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));border-radius:18px;overflow:hidden;box-shadow:0 16px 36px rgba(0,0,0,0.55),inset 0 1px 0 rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.16);z-index:17;opacity:1;transform:scale(1);transition:width .28s cubic-bezier(.4,0,.2,1),height .28s cubic-bezier(.4,0,.2,1),right .28s cubic-bezier(.4,0,.2,1),bottom .28s cubic-bezier(.4,0,.2,1),border-radius .28s ease,opacity .28s ease,transform .28s ease;background:var(--ink);}
  #moviePlayer.minimized{width:168px;height:96px;}
  #moviePlayer.minimized-large{width:280px;height:158px;}
  #moviePlayer.minimized #playerTop,#moviePlayer.minimized-large #playerTop,#moviePlayer.minimized #playerInfo,#moviePlayer.minimized-large #playerInfo{display:none;}
  #moviePlayer.minimized #videoWrap,#moviePlayer.minimized-large #videoWrap{width:100%;height:100%;aspect-ratio:auto;cursor:pointer;}
  #moviePlayer.minimized video,#moviePlayer.minimized-large video{object-fit:cover;}
  #moviePlayer.minimized-large .mini-x{display:flex;position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:12px;align-items:center;justify-content:center;z-index:3;cursor:pointer;}
  #moviePlayer.minimized .mini-x{display:none;}

  /* ===== Mini player bar (for small mini) ===== */
  #miniBar{display:none;position:fixed;right:14px;bottom:calc(48px + env(safe-area-inset-bottom));z-index:18;align-items:center;gap:8px;padding:6px;border-radius:14px;background:rgba(7,7,10,0.9);border:1px solid var(--glass-border);box-shadow:0 10px 26px rgba(0,0,0,0.5);}
  #miniBar .mb-x{width:28px;height:28px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  /* ===== Episode picker ===== */
  #epPicker{display:none;margin:0 16px 16px;}
  #epPicker.open{display:block;}
  .ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .ep-btn{padding:10px 6px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;text-align:center;}
  .ep-btn.active{background:rgba(255,59,92,0.2);border-color:var(--accent);}

  /* ===== Live TV ===== */
  .live-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px 20px;}
  .live-card{border-radius:16px;overflow:hidden;cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);}
  .live-card .thumb{height:90px;background:linear-gradient(160deg,#232330,#17171f);display:flex;align-items:center;justify-content:center;position:relative;}
  .live-card .thumb .live-dot{position:absolute;top:8px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
  .live-card .lname{font-size:12px;font-weight:700;padding:10px;text-align:center;}

  /* ===== Tab bar ===== */
  #tabbar{
    position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:14;
    display:flex;justify-content:space-around;align-items:center;padding:12px 6px;border-radius:26px;
  }
  #tabbar .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-dim);font-size:10.5px;font-weight:600;cursor:pointer;padding:6px 10px;border-radius:16px;transition:transform .15s ease,background .15s ease;border:none;background:none;}
  #tabbar .tab:active{transform:scale(0.9);}
  #tabbar .tab.active{color:var(--text);background:rgba(255,59,92,0.14);box-shadow:inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -4px 8px rgba(0,0,0,0.15);}
  #tabbar .tab svg{width:22px;height:22px;}
  #tabbar .tab.active svg{color:var(--accent);filter:drop-shadow(0 0 5px rgba(255,59,92,0.6));}

  .toast{
    position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;
    background:rgba(20,20,24,0.92);border:1px solid var(--glass-border);color:var(--text);
    padding:12px 20px;border-radius:14px;font-size:13px;font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);display:none;backdrop-filter:blur(10px);
    max-width:88vw;text-align:center;
  }
</style>
</head>
<body>
<div id="app">
  <header id="appbar">
    <div class="brand"><div class="logo">▶</div><b>BROKEN <span>Movies</span></b></div>
    <div class="appbar-actions">
      <button class="icon-btn" onclick="toggleSearch()" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </button>
      <button class="icon-btn" onclick="openProfile()" aria-label="Profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <div id="searchWrap">
    <input id="searchBox" placeholder="Search movies, series & anime..." onkeydown="if(event.key==='Enter')doSearch(this.value)">
  </div>

  <!-- Category pills injected per view -->
  <div id="catBar" class="cat-scroll" style="display:none"></div>

  <!-- Main content -->
  <div id="content">
    <div class="loading"><div class="spinner"></div>Loading...</div>
  </div>

  <!-- Episode picker -->
  <div id="epPicker"></div>
</div>

<!-- Movie player -->
<div id="moviePlayer">
  <div id="playerTop">
    <button class="p-back" onclick="playerBack()">←</button>
    <div class="p-title" id="playerTitle"></div>
    <button class="p-btn" id="cinemaBtn" onclick="toggleCinema()">⛶</button>
  </div>
  <div id="videoWrap"><video id="video" controls playsinline></video></div>
  <div class="cinema-bar">
    <button class="c-btn" onclick="toggleCinema()">⤢</button>
    <button class="c-btn" onclick="playerBack()">✕</button>
  </div>
  <div id="playerInfo"></div>
</div>
<div id="miniBar"><button class="mb-x" onclick="closePlayer(true)">✕</button></div>

<!-- Detail -->
<div id="detail"></div>

<div class="toast" id="toast"></div>

<!-- Tab bar -->
<div id="tabbar" class="glass">
  <button class="tab active" data-tab="home" onclick="go('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11 M6 10 V20 H18 V10"/></svg><div>Home</div>
  </button>
  <button class="tab" data-tab="movies" onclick="go('movies')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 4v5M16 4v5"/></svg><div>Movies</div>
  </button>
  <button class="tab" data-tab="anime" onclick="go('anime')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H4z"/><path d="M9 8l6 3.5L9 15V8z" fill="currentColor" stroke="none"/></svg><div>Anime</div>
