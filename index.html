<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BROKEN Movies</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- App Bar -->
<header class="appbar">
  <div class="brand">
    <div class="logo">▶</div>
    <b>BROKEN <span>Movies</span></b>
  </div>
  <div class="actions">
    <button class="icon-btn" onclick="openProfile()" id="profileBtn" aria-label="Profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    </button>
    <button class="icon-btn" onclick="toggleSearch()" aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
    <button class="icon-btn" onclick="toast('BROKEN Movies · powered by BROKEN API')" aria-label="Info">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
    </button>
  </div>
</header>

<!-- Search -->
<div class="searchbar" id="searchbar">
  <input id="q" placeholder="Search movies & series..." onkeydown="if(event.key==='Enter')search()">
  <button onclick="search()">Go</button>
</div>

<!-- Genre chips -->
<div class="chips" id="chips" style="display:none">
  <button class="chip" onclick="genre('action')">Action</button>
  <button class="chip" onclick="genre('comedy')">Comedy</button>
  <button class="chip" onclick="genre('horror')">Horror</button>
  <button class="chip" onclick="genre('romance')">Romance</button>
  <button class="chip" onclick="genre('scifi')">Sci-Fi</button>
  <button class="chip" onclick="genre('drama')">Drama</button>
  <button class="chip" onclick="genre('animation')">Animation</button>
  <button class="chip" onclick="genre('documentary')">Documentary</button>
</div>

<!-- Anime genre chips (shown in Anime view) -->
<div class="chips" id="animeChips" style="display:none">
  <button class="chip" onclick="animeGenre('action')">Action</button>
  <button class="chip" onclick="animeGenre('romance')">Romance</button>
  <button class="chip" onclick="animeGenre('fantasy')">Fantasy</button>
  <button class="chip" onclick="animeGenre('comedy')">Comedy</button>
  <button class="chip" onclick="animeGenre('horror')">Horror</button>
  <button class="chip" onclick="animeGenre('scifi')">Sci-Fi</button>
  <button class="chip" onclick="animeGenre('drama')">Drama</button>
</div>

<!-- Episode picker -->
<div class="epicker" id="epicker" style="display:none"></div>

<main class="container" id="content">
  <div class="loading"><div class="spinner"></div>Loading...</div>
</main>

<footer>BROKEN Movies · creator: brokenvzn</footer>

<!-- Modal -->
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box" id="modalBox"></div>
</div>

<div class="toast" id="toast"></div>

<!-- FAB -->
<button class="fab" onclick="openInfo()" aria-label="Info">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm-1 15v-6h2v6h-2zm0-8V7h2v2h-2z"/></svg>
</button>

<!-- Bottom Nav -->
<nav class="bottomnav" id="bottomnav">
  <button class="nav-item active" data-view="home" onclick="go('home')">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home
  </button>
  <button class="nav-item" data-view="movies" onclick="go('movies')">
    <svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M8 4l4 5-4 5M16 4l-3 5 3 5"/></svg>Movies
  </button>
  <button class="nav-item" data-view="series" onclick="go('series')">
    <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="15" rx="2"/><path d="M17 2l-5 5-5-5"/></svg>TV
  </button>
  <button class="nav-item" data-view="nollywood" onclick="go('nollywood')">
    <svg viewBox="0 0 24 24"><path d="M12 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>Nolly
  </button>
  <button class="nav-item" data-view="genres" onclick="go('genres')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.5 9.5l5-3M9.5 9.5l2 5 3-5"/></svg>Genres
  </button>
  <button class="nav-item" data-view="bl" onclick="go('bl')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v5m0 0l-3 6m3-6l3 6"/></svg>BL
  </button>
  <button class="nav-item" data-view="kdrama" onclick="go('kdrama')">
    <svg viewBox="0 0 24 24"><path d="M12 3l2 4 5 .5-3.5 3 1 5L12 13l-4.5 2.5 1-5L5 7.5 10 7z"/></svg>K-Drama
  </button>
  <button class="nav-item" data-view="anime" onclick="go('anime')">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.4 4.6 5.6.6-4 3.8 1 5.6-5-2.6-5 2.6 1-5.6-4-3.8 5.6-.6z"/></svg>Anime
  </button>
  <button class="nav-item" data-view="hollywood" onclick="go('hollywood')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>Hollywood
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
